# Widen the group range allowed to open ICMP echo sockets (used by cloudflared's
# optional ICMP proxy / edge diagnostics). Some distros ship a tight or empty
# `ping_group_range`, which produces:
#   "Group ID 0 is not between ping group 1 to 0"
# when cloudflared runs as root via systemd.
#
# Install:
#   sudo cp deploy/linux/99-cloudflared-ping.conf /etc/sysctl.d/99-cloudflared-ping.conf
#   sudo sysctl -p /etc/sysctl.d/99-cloudflared-ping.conf
#
# Or run: ./scripts/fix-local-cloudflare-stack.sh
net.ipv4.ping_group_range = 0 2147483647
